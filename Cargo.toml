[package]
name = "tupa-launcher"
version = "0.9.0"
edition = "2024"

[features]
# 自绘 GUI（src/gui/，2026-11-06 起冷冻）：默认不编译，省掉 winit / cosmic-text /
# softbuffer / unicode-script 四个重依赖的编译时间。要用 `--gui` 时显式
# `cargo build --release --features gui`。代码保留当资产，不随 feature 删除。
gui = ["dep:winit", "dep:cosmic-text", "dep:softbuffer", "dep:unicode-script"]

[dependencies]
anyhow = "1.0.104"
cosmic-text = { version = "0.19.0", optional = true }
crossterm = "0.29.0"
dirs = "7.0.0"
encoding_rs = "0.8.42"
fuzzy-matcher = "0.3.7"
open = { version = "5.4.4", features = ["shellexecute-on-windows"] }
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
softbuffer = { version = "0.4", optional = true }
toml = "1.1.8"
unicode-script = { version = "0.5", optional = true }
unicode-width = "0.2.2"
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_Storage_FileSystem"] }
windows-sys = { version = "0.61.2", features = ["Win32_UI_Accessibility", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_SystemInformation"] }
winit = { version = "0.30", optional = true }
