[package]
name = "tupa-launcher"
version = "0.8.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
cosmic-text = "0.19.0"
crossterm = "0.29.0"
dirs = "7.0.0"
encoding_rs = "0.8.42"
fuzzy-matcher = "0.3.7"
open = { version = "5.4.4", features = ["shellexecute-on-windows"] }
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
softbuffer = "0.4"
toml = "1.1.8"
unicode-script = "0.5"
unicode-width = "0.2.2"
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Storage_FileSystem"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Memory"] }
winit = "0.30"
