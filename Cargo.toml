[package]
name = "tupa-launcher"
version = "0.10.0"
edition = "2024"

[lib]
name = "tupa_launcher"
path = "src/lib.rs"

[[bin]]
name = "tupa-launcher"
path = "src/main.rs"

# GPUI 面板：独立进程 + 自带托盘/热键，见 `src/gui_main.rs`。
# `required-features` 让默认 `cargo build` 完全不碰 gpui。
[[bin]]
name = "tupa-gui"
path = "src/gui_main.rs"
required-features = ["gui"]

[features]
# 自绘 GUI（GPUI，`src/gui/`）：默认不编译，省掉 GPUI 庞大依赖树的编译时间。
# 要用 `--gui` 时显式 `cargo build --release --features gui`。
gui = ["dep:gpui", "dep:image"]

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
dirs = "7.0.0"
encoding_rs = "0.8.42"
fuzzy-matcher = "0.3.7"
# GPUI 是 pre-1.0，固定小版号，升级单独一次提交（
# 2026-11 官方已宣布不再为独立应用加功能，跟 Zed 自身需求走）。
gpui = { version = "=0.2.2", optional = true }
# 应用图标要构造 `gpui::RenderImage`，它吃 `image::Frame`；版本必须和 vendor/gpui
# 的 `image` 一致（同一 crate 版本，否则 `Frame` 是不同类型）。只要构造能力，
# 不需要任何解码器，所以 `default-features = false`。
image = { version = "0.25", optional = true, default-features = false, features = ["png", "ico", "jpeg"] }
open = { version = "5.4.4", features = ["shellexecute-on-windows"] }
# 与 gpui 用的版本一致：`gui::acrylic` 靠它拿 HWND
raw-window-handle = "0.6.2"
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
unicode-width = "0.2.2"
# `UI_Composition*` / `Foundation_Numerics` / `Win32_System_WinRT*` 是给
# `examples/acrylic_probe.rs`（窗口模糊可行性探针）用的；GPUI 那边的 fork 也走同一套 API。
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_Storage_FileSystem", "Win32_System_WinRT", "Win32_System_WinRT_Composition", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Networking_WinHttp", "Win32_UI_Controls", "UI_Composition", "UI_Composition_Desktop", "Foundation_Numerics", "System"] }
windows-numerics = "0.3.1"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Accessibility", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_SystemInformation"] }

# GPUI 0.2.2 拉了一份 vendor 副本，只为一个 patch：`get_client_area_insets` 返回 0
# （客户区铺满窗口，否则 `WS_THICKFRAME` 那一圈会被 DWM 填成浅灰，开亚克力后
# 「面板外多一圈」）。0.2.2 官方已停止演进，维护成本可接受。
# 升级 GPUI 时记得把 patch 重新打一遍，细节见 `docs/06-handover.md` §6。
[patch.crates-io]
gpui = { path = "vendor/gpui" }
