# tupa-launcher 配置示例
# 实际路径：~/.config/tupa-launcher/config.toml
#     即 C:\Users\<你>\.config\tupa-launcher\config.toml

[general]
# 输入**不带 `:` 前缀**时，整行交给哪个 provider：
#   all = 应用 + 命令历史混排（默认）
#   app = 只搜应用
#   ev  = Everything 搜文件
default_provider = "all"
# 单个 provider 最多返回多少条
max_results = 30
# es.exe 路径；留空自动探测（PATH → %LOCALAPPDATA%\Everything → Program Files）
# everything_path = 'C:\Users\<你的用户名>\AppData\Local\Everything\es.exe'
# 开屏时输入框是否预填 `:`（true = 直接进命令模式；false = 空输入，但仍显示命令列表）
prefill_colon = false
# 命令前缀（默认 `:`）；修饰符分隔符也用它，例如 @run@admin
# 界面语言：zh / en
# 右下角是否显示快捷键提示
show_hints = true
# 开屏与 @app 空查询是否按 frecency（使用频率 × 新鲜度）排序
# 关掉后：开屏历史按时间、@app 按配置顺序
frecency = true
# 剪贴板里是存在的路径 / http(s) 网址时，开屏第一行多一条「跳过去」（默认不选中）
clipboard = true
language = "zh"
command_prefix = ":"

# ---------------------------------------------------------------------------
# 博客（:blog）：新建文章 / 管理页 / 三个站点入口
# ---------------------------------------------------------------------------

[gui]
# GPUI 面板（tupa-gui.exe）自己的设置，与 [daemon] 完全独立：
# 它自带托盘图标和全局热键，不经过守护进程。
# 唤起 / 隐藏面板的热键（写法同 [daemon] hotkey，别和它用同一个组合）
hotkey = "alt+0"
# 是否显示托盘图标（左键显示/隐藏，右键菜单：显示面板 / 退出）
tray = true
# 面板背景不透明度：1.0 = 完全不透明，0.88 能透出后面的壁纸/窗口
# 开了 acrylic 之后它就是「亚克力上的 tint 浓度」，0.7~0.85 比较好看
opacity = 1.0
# 是否给面板挂 Windows 亚克力材质（背景实时模糊）。
# 注意：节能模式开着、或系统「透明效果」关闭时，DWM 会把 Acrylic 降级成纯色
# （不是本程序的问题），排查「开了没效果」先看那两处。
acrylic = false
# 面板是否一直置顶（默认开；关掉会被普通窗口压住，GlazeWM 不管浮层）
always_on_top = true

[blog]
# 博客仓库根目录（package.json 和 source/_posts 在这里）；留空 = ~/blog
# dir = 'C:\Users\<你>\blog'
# 本地预览（pnpm server，Hexo 默认 4000）
local_url = "http://localhost:4000"
# GitHub Pages
github_url = "https://nitsugaoo.github.io"
# Cloudflare Workers
cloudflare_url = "https://blog.wooyun.workers.dev"
# pnpm admin 起来的管理页
admin_url = "http://127.0.0.1:5173"

# ---------------------------------------------------------------------------
# 常驻守护进程（--daemon）：全局热键 + 面板显隐
# ---------------------------------------------------------------------------

[daemon]
# 唤起 / 隐藏面板的全局热键（ctrl / alt / shift / win + 主键）
hotkey = "alt+`"
# 是否接管 Copilot 键（Win+Shift+F23）
copilot_key = true
# 热键唤起哪种面板：
#   tui = 终端模拟器里的终端界面（默认）
#   gui = GPUI 面板，独立程序 tupa-gui.exe（默认构建不含，要 cargo build --release --features gui）
panel = "tui"
# TUI 面板跑在哪个终端里：auto / wezterm / wt
#   auto = 装了 WezTerm 就用 WezTerm，否则退回 Windows Terminal
# WezTerm 面板用 `--class tupa-launcher` 锁定窗口（类名全机唯一），比 WT 靠标题前缀更稳。
# 退回 wt 时需要一个叫 `tupa-launcher` 的 Windows Terminal profile。
terminal = "auto"

# ---------------------------------------------------------------------------
# GlazeWM 集成
# ---------------------------------------------------------------------------

[glazewm]
# 打开网页后（:web / :blog / 收藏里的网址），如果浏览器窗口在别的 workspace 里，
# 让 GlazeWM 把那个 workspace 切到前台。没装 GlazeWM 时自动忽略。
# 关掉它：网页只会在后台新建一个标签，你在别的 workspace 时看不到任何变化。
focus_browser = true

# ---------------------------------------------------------------------------
# 应用列表（需求 R4：最常用的功能，列表自己说了算）
#
# 顺序 = 空输入时的显示顺序，把最常用的放前面即可。
#   name      列表里显示的名字
#   command   要执行的命令：绝对路径 / PATH 里的命令名 / URL 都行
#   args      额外参数（可选）
#   keywords  额外别名，参与模糊匹配（可选）
# ---------------------------------------------------------------------------

[[apps]]
name = "终端 (Windows Terminal)"
command = "wt"

[[apps]]
name = "文件资源管理器"
command = "explorer"

[[apps]]
name = "Visual Studio Code"
command = "code"
keywords = ["vsc", "vs"]

[[apps]]
name = "Firefox"
command = "firefox"

[[apps]]
name = "Everything"
command = "everything"

[[apps]]
name = "系统设置"
command = "ms-settings:"

[[apps]]
name = "任务管理器"
command = "taskmgr"

# ---------------------------------------------------------------------------
# 主题色（需求 R2）
#
# 不写则使用内置的 Everforest(hard) 默认色。
# 想整体换色：在 ~/.config/tupa-launcher/theme.toml 里写这些字段即可
# （独立文件的优先级低于 config.toml 里的同名值）。
# ---------------------------------------------------------------------------

[theme]
# background = "#272e33"   # 一级背景
# panel      = "#2e383c"   # 输入行 / 状态栏底色
# overlay    = "#374145"   # 选中行底色
# border     = "#414b50"   # 分隔线
# fg         = "#d3c6aa"   # 正文
# muted      = "#9da9a0"   # 次要
# dim        = "#859289"   # 更淡（徽标）
# faint      = "#7a8478"   # 最淡（路径、提示）
# accent     = "#a7c080"   # 强调色
# good       = "#83c092"   # 成功
# warn       = "#dbbc7f"   # 警告
# bad        = "#e67e80"   # 错误

# ---------------------------------------------------------------------------
# 应用内开关（`:switch`）
#
# 不在这个文件里配置。开关 / 选项 / 数值写在独立文件
# ~/.config/tupa-launcher/actions.toml 里（不写则该命令只用内置的
# 深色模式 / 屏幕亮度 / 电池养护模式 / 节能模式 / 保持唤醒）。格式见 README 的「应用内开关」一节：
#
#   [[items]]
#   kind = "toggle"            # toggle / choice / number
#   title = "电池养护模式"
#   get = '...'                # stdout 第一行是当前值
#   on  = '...'
#   off = '...'
# ---------------------------------------------------------------------------
